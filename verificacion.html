<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificación de Seguridadd</title>
  
  <!-- Estilos opcionales existentes en tu repo -->
  <link rel="stylesheet" href="style.css">

  <!-- 1. Script oficial de Cloudflare Turnstile -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

  <div style="text-align: center; margin-top: 60px; font-family: sans-serif;">
    <h2>Verificación de seguridad</h2>
    <p>Completa la prueba para continuar hacia la aplicación.</p>

    <!-- 2. Widget de verificación (Reemplaza TU_SITE_KEY_AQUI) 
    secret  key- 0x4AAAAAAEGXNl3IiU9pRR6WKc6QIK7TVto -->
    
    <div class="cf-turnstile" 
         data-sitekey="0x4AAAAAAEGXNq1w_tDjES0H" 
         data-callback="alCompletarVerificacion"
         style="display: inline-block; margin: 20px 0;">
    </div>

    <br>

    <!-- 3. Botón de acceso (inicia bloqueado) -->
    <button id="btnIngresar" disabled onclick="irAAppSheet()" 
            style="padding: 12px 24px; font-size: 16px; opacity: 0.5; cursor: not-allowed; border-radius: 6px;">
      Esperando verificación...
    </button>
  </div>

  <!-- 4. Lógica en JavaScript -->
  <script>
    // Pega aquí la URL exacta que copiaste de AppSheet
    const urlAppSheet = "https://dba-aquaa.github.io/SGSA---AQUAA/";

    // Esta función la llama Cloudflare automáticamente al pasar el CAPTCHA
    function alCompletarVerificacion(token) {
      const boton = document.getElementById("btnIngresar");
      
      // Desbloquea el botón
      boton.disabled = false;
      boton.style.opacity = "1";
      boton.style.cursor = "pointer";
      boton.innerText = "Ingresar a AppSheet";

      // NOTA: Si prefieres que la página redirija al instante SIN pedir clic en el botón,
      // borra las dos barras (//) de la siguiente línea:
      window.location.href = urlAppSheet;
    }

    // Acción manual al presionar el botón
    function irAAppSheet() {
      window.location.href = urlAppSheet;
    }
  </script>

</body>
</html>
